version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - DATABASE_NAME=${DATABASE_NAME:-calorie_tracker}
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_MINUTES=20160
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - SEED=${SEED:-true}
    ports:
      - "8000:8000"
    depends_on:
      - mongo
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  mongo_data: {}
